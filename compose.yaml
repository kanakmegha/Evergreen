services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: everroot
      POSTGRES_USER: everroot
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:54330:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U everroot -d everroot"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - everroot_pg:/var/lib/postgresql/data
volumes:
  everroot_pg:
